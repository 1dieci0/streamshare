[package]
name = "streamshare"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
egui = "0.35.0"
egui-wgpu = "0.35.0"
egui-winit = "0.35.0"
io = "0.0.2"
mpsc = "0.3.0"
openh264 = { version = "0.9.7", features = ["source"] }
pixels = "0.17.2"
quinn = "0.11.11"
rand = "0.10.2"
rcgen = "0.14.8"
rustls = {version = "0.23.43", features = ["ring"]}
scrap = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# scap = "0.0.5"
sha2 = "0.11.0"
tokio = {version = "1.53.1", features = ["full"] }
winit = "0.30.13"
winit_input_helper = "0.17.0"
